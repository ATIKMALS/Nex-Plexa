<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" href="https://i.imgur.com/Ek71fcY.png" type="image/x-icon">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Premium Viral Hub</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #1a2a6c, #b21f1f, #1a2a6c);
            color: white;
            position: relative;
            overflow-x: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .login-container {
            background: rgba(0, 0, 0, 0.8);
            border-radius: 20px;
            padding: 40px;
            max-width: 400px;
            width: 90%;
            box-shadow: 0 0 30px rgba(0,0,0,0.8);
            border: 1px solid rgba(255, 215, 0, 0.3);
            position: relative;
            z-index: 10;
        }
        
        .login-header {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .login-header img {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            border: 3px solid #ffd700;
            margin-bottom: 15px;
        }
        
        .login-header h1 {
            color: #ffd700;
            font-size: 24px;
            margin-bottom: 10px;
        }
        
        .login-header p {
            color: rgba(255, 255, 255, 0.7);
            font-size: 14px;
        }
        
        .security-badge {
            background: linear-gradient(45deg, #ff0000, #ff6600);
            color: white;
            padding: 8px 15px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            display: inline-block;
            margin-bottom: 20px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #ffd700;
        }
        
        .form-group input {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            font-size: 14px;
            transition: all 0.3s ease;
        }
        
        .form-group input:focus {
            outline: none;
            border-color: #ffd700;
            background: rgba(255, 255, 255, 0.15);
        }
        
        .form-group input::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }
        
        .password-field {
            position: relative;
        }
        
        .password-toggle {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.7);
            cursor: pointer;
            font-size: 16px;
        }
        
        .password-toggle:hover {
            color: #ffd700;
        }
        
        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 15px;
        }
        
        .btn-primary {
            background: linear-gradient(45deg, #ff6b6b, #ff8e53);
            color: white;
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255, 107, 107, 0.4);
        }
        
        .btn-secondary {
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
        
        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
        }
        
        .alert {
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-weight: 600;
            text-align: center;
        }
        
        .alert-error {
            background: rgba(220, 53, 69, 0.2);
            border: 1px solid #dc3545;
            color: #dc3545;
        }
        
        .alert-success {
            background: rgba(40, 167, 69, 0.2);
            border: 1px solid #28a745;
            color: #28a745;
        }
        
        .login-footer {
            text-align: center;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        .login-footer p {
            color: rgba(255, 255, 255, 0.6);
            font-size: 12px;
            margin-bottom: 10px;
        }
        
        .back-link {
            color: #ffd700;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        
        .back-link:hover {
            color: #ffed4e;
            text-decoration: underline;
        }
        
        .loading {
            display: none;
            text-align: center;
            margin-top: 10px;
        }
        
        .spinner {
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top: 2px solid #ffd700;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
            display: inline-block;
            margin-right: 10px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .attempts-warning {
            background: rgba(255, 193, 7, 0.2);
            border: 1px solid #ffc107;
            color: #ffc107;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 15px;
            font-size: 12px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <img src="https://i.imgur.com/Ek71fcY.png" alt="Admin Logo">
            <h1>Admin Access</h1>
            <p>Enter your credentials to access the admin panel</p>
            <div class="security-badge">
                <i class="fas fa-shield-alt"></i> SECURE ACCESS
            </div>
        </div>
        
        <div id="alertMessage"></div>
        
        <form id="adminLoginForm">
            <div class="form-group">
                <label for="adminEmail">
                    <i class="fas fa-envelope"></i> Admin Email
                </label>
                <input type="email" id="adminEmail" name="email" placeholder="Enter admin email" required>
            </div>
            
            <div class="form-group">
                <label for="adminPassword">
                    <i class="fas fa-lock"></i> Admin Password
                </label>
                <div class="password-field">
                    <input type="password" id="adminPassword" name="password" placeholder="Enter admin password" required>
                    <button type="button" class="password-toggle" onclick="togglePassword()">
                        <i class="fas fa-eye"></i>
                    </button>
                </div>
            </div>
            
            <div id="attemptsWarning" class="attempts-warning" style="display: none;">
                <i class="fas fa-exclamation-triangle"></i>
                <span id="attemptsText"></span>
            </div>
            
            <button type="submit" class="btn btn-primary" id="loginBtn">
                <i class="fas fa-sign-in-alt"></i> Login to Admin Panel
            </button>
            
            <div class="loading" id="loading">
                <div class="spinner"></div>
                Authenticating...
            </div>
        </form>
        
        <div class="login-footer">
            <p>Only authorized administrators can access this panel</p>
            <a href="dashboard.html" class="back-link">
                <i class="fas fa-arrow-left"></i> Back to Dashboard
            </a>
        </div>
    </div>

    <script>
        // Admin credentials (in real app, this would be server-side)
        const ADMIN_CREDENTIALS = {
            email: 'admin@premiumviralhub.com',
            password: 'admin123456'
        };
        
        // Track login attempts
        let loginAttempts = 0;
        const MAX_ATTEMPTS = 3;
        const LOCKOUT_TIME = 5 * 60 * 1000; // 5 minutes
        
        // Check if user is locked out
        function checkLockout() {
            const lockoutTime = localStorage.getItem('adminLockoutTime');
            if (lockoutTime) {
                const timeLeft = parseInt(lockoutTime) - Date.now();
                if (timeLeft > 0) {
                    const minutes = Math.floor(timeLeft / 60000);
                    const seconds = Math.floor((timeLeft % 60000) / 1000);
                    showAlert(`Account temporarily locked. Try again in ${minutes}:${seconds.toString().padStart(2, '0')}`, 'error');
                    return true;
                } else {
                    localStorage.removeItem('adminLockoutTime');
                    loginAttempts = 0;
                }
            }
            return false;
        }
        
        // Show alert message
        function showAlert(message, type) {
            const alertDiv = document.getElementById('alertMessage');
            alertDiv.innerHTML = `<div class="alert alert-${type}">${message}</div>`;
            
            setTimeout(() => {
                alertDiv.innerHTML = '';
            }, 5000);
        }
        
        // Toggle password visibility
        function togglePassword() {
            const passwordInput = document.getElementById('adminPassword');
            const toggleBtn = document.querySelector('.password-toggle i');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                toggleBtn.className = 'fas fa-eye-slash';
            } else {
                passwordInput.type = 'password';
                toggleBtn.className = 'fas fa-eye';
            }
        }
        
        // Handle form submission
        document.getElementById('adminLoginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            // Check if locked out
            if (checkLockout()) {
                return;
            }
            
            const email = document.getElementById('adminEmail').value;
            const password = document.getElementById('adminPassword').value;
            
            // Show loading
            document.getElementById('loginBtn').style.display = 'none';
            document.getElementById('loading').style.display = 'block';
            
            // Simulate authentication delay
            setTimeout(() => {
                // Check credentials
                if (email === ADMIN_CREDENTIALS.email && password === ADMIN_CREDENTIALS.password) {
                    // Success
                    loginAttempts = 0;
                    localStorage.removeItem('adminLockoutTime');
                    
                    // Set admin session
                    localStorage.setItem('adminAuthenticated', 'true');
                    localStorage.setItem('adminLoginTime', Date.now().toString());
                    
                    showAlert('Login successful! Redirecting to admin panel...', 'success');
                    
                    // Redirect to admin panel
                    setTimeout(() => {
                        window.location.href = 'admin-panel.html';
                    }, 1500);
                    
                } else {
                    // Failed login
                    loginAttempts++;
                    
                    if (loginAttempts >= MAX_ATTEMPTS) {
                        // Lock account
                        const lockoutEnd = Date.now() + LOCKOUT_TIME;
                        localStorage.setItem('adminLockoutTime', lockoutEnd.toString());
                        showAlert('Too many failed attempts. Account locked for 5 minutes.', 'error');
                    } else {
                        const attemptsLeft = MAX_ATTEMPTS - loginAttempts;
                        showAlert(`Invalid credentials. ${attemptsLeft} attempts remaining.`, 'error');
                        
                        // Show attempts warning
                        document.getElementById('attemptsWarning').style.display = 'block';
                        document.getElementById('attemptsText').textContent = 
                            `${attemptsLeft} attempts remaining before account lockout.`;
                    }
                    
                    // Clear form
                    document.getElementById('adminPassword').value = '';
                    document.getElementById('adminPassword').focus();
                }
                
                // Hide loading
                document.getElementById('loginBtn').style.display = 'block';
                document.getElementById('loading').style.display = 'none';
                
            }, 1000);
        });
        
        // Check authentication on page load
        window.addEventListener('load', function() {
            // Check if already authenticated
            const isAuthenticated = localStorage.getItem('adminAuthenticated');
            const loginTime = localStorage.getItem('adminLoginTime');
            
            if (isAuthenticated && loginTime) {
                const timeSinceLogin = Date.now() - parseInt(loginTime);
                const sessionTimeout = 2 * 60 * 60 * 1000; // 2 hours
                
                if (timeSinceLogin < sessionTimeout) {
                    // Still valid session, redirect to admin panel
                    window.location.href = 'admin-panel.html';
                } else {
                    // Session expired
                    localStorage.removeItem('adminAuthenticated');
                    localStorage.removeItem('adminLoginTime');
                    showAlert('Session expired. Please login again.', 'error');
                }
            }
            
            // Check lockout status
            checkLockout();
        });
        
        // Auto-update lockout timer
        setInterval(() => {
            checkLockout();
        }, 1000);
    </script>
</body>
</html>
